name: publish

# Publishing follows main in two cases. A push can carry a release commit whose
# version is already in git but not yet on npm, or it can carry releasable
# commits (`fix:`, `feat:`, or a Conventional Commit breaking change marker), in
# which case this workflow cuts the next version itself, pushes the release
# commit and tag, and publishes that version.
#
# Registry versions are immutable, so the workflow asks two questions first:
# whether the version in `package.json` is already published, and whether the
# commits since the latest release tag call for a new one. A re-run, a revert,
# and a merge with no releasable commit then all skip rather than failing.
on:
  push:
    branches: [main]
  # For re-running a publish that failed after the release commit was pushed.
  workflow_dispatch:

# One publish at a time. Two pushes close together would otherwise start two
# jobs that both read the same version, both find it absent, and race: one
# publishes and the other fails on a version that is now taken. Queueing rather
# than cancelling, because a publish that has started should finish.
concurrency:
  group: publish
  cancel-in-progress: false

# Read-only by default. The one job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # This job pushes the release commit and tag when it cuts a version.
      contents: write
      # Required for npm provenance, and for trusted publishing if it is
      # configured on npmjs.com. Without it a publish still works over a token
      # but ships no provenance attestation. Scoped to this job so that a job
      # added to this file later does not inherit a token that can mint an
      # identity on the registry.
      id-token: write
    # A publish that hangs holds the concurrency group and blocks every release
    # behind it.
    timeout-minutes: 30
    # The gate between a push to main and a version nobody can take back after
    # seventy-two hours. Configure required reviewers on this environment in the
    # repository settings, and scope NPM_TOKEN to it if a token is used at all.
    # An environment with no rules configured is a label and blocks nothing,
    # which is the state it starts in.
    environment:
      name: npm
      url: https://www.npmjs.com/package/docbound
    steps:
      # Pinned by commit; see `.github/workflows/ci.yml` for why.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4, resolved 2026-09-02
        with:
          # The audit diffs against the merge base, and a shallow clone has none.
          fetch-depth: 0
          # Nothing here pushes, and this job holds a registry identity.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, resolved 2026-09-02
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Release state
        id: state
        run: |
          current="$(node -p "require('./package.json').version")"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          published=false
          # Any lookup failure counts as not published. A name that has never
          # been published and a version that does not exist yet both fail here,
          # and both should publish.
          if npm view "docbound@$current" version >/dev/null 2>&1; then
            published=true
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"

          next="$(node scripts/release.mjs --next)"
          if [ -n "$next" ]; then
            echo "next=$next" >> "$GITHUB_OUTPUT"
          fi

          if [ "$published" = "false" ]; then
            echo "mode=publish-current" >> "$GITHUB_OUTPUT"
            echo "version=$current" >> "$GITHUB_OUTPUT"
            echo "docbound@$current is not on the registry; publishing the tagged version already in git."
          elif [ -n "$next" ]; then
            echo "mode=cut-and-publish" >> "$GITHUB_OUTPUT"
            echo "version=$next" >> "$GITHUB_OUTPUT"
            echo "docbound@$current is current on the registry; cutting $next from releasable commits on main."
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "version=$current" >> "$GITHUB_OUTPUT"
            echo "docbound@$current is current on the registry and no releasable commits are waiting."
          fi

      # Trusted publishing needs a newer npm than the one bundled with Node 22.
      # Harmless when publishing over a token. Pinned to a major rather than
      # `latest`, so the release does not install whatever was published to the
      # registry an hour ago.
      - name: Use a current npm
        if: steps.state.outputs.mode != 'skip'
        run: npm install -g npm@12

      # A version already in git but not yet on the registry is published as-is,
      # so it needs the same three gates CI runs before the immutable step.
      - name: Tests
        if: steps.state.outputs.mode == 'publish-current'
        run: npm test

      - name: dist is current
        if: steps.state.outputs.mode == 'publish-current'
        run: node scripts/check-dist-fresh.mjs

      - name: docbound audits itself
        if: steps.state.outputs.mode == 'publish-current'
        run: node cli/index.mjs audit

      - name: Confirm unpublished version is the tagged release commit
        if: steps.state.outputs.mode == 'publish-current'
        run: |
          head="$(git rev-parse HEAD)"
          tagged="$(git rev-list -n 1 "v${{ steps.state.outputs.version }}")"
          test "$head" = "$tagged"

      - name: Configure git author
        if: steps.state.outputs.mode == 'cut-and-publish'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cut release commit and tag
        if: steps.state.outputs.mode == 'cut-and-publish'
        run: node scripts/release.mjs --version "${{ steps.state.outputs.version }}"

      - name: Push release commit and tag
        if: steps.state.outputs.mode == 'cut-and-publish'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$remote" HEAD:main --follow-tags

      - name: What would be published
        if: steps.state.outputs.mode != 'skip'
        run: npm pack --dry-run

      - name: Publish
        if: steps.state.outputs.mode != 'skip'
        run: npm publish --provenance --access public
        env:
          # Empty when trusted publishing is configured on npmjs.com, which is
          # the better arrangement: no long-lived secret in this repository.
          # Set NPM_TOKEN as a repository secret to publish over a token instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        if: always()
        run: |
          v="${{ steps.state.outputs.version }}"
          mode="${{ steps.state.outputs.mode }}"
          if [ "$mode" = "publish-current" ]; then
            echo "published docbound@$v from the tagged release already on main" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$mode" = "cut-and-publish" ]; then
            echo "cut and published docbound@$v from releasable commits on main" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "docbound@$v already on the registry; no releasable commits on main" >> "$GITHUB_STEP_SUMMARY"
          fi
